name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'https://www.laksidu.site'
        required: true
        default: 'https://www.laksidu.site'
      total_requests:
        description: 'Total number of requests'
        required: true
        default: '2000'
      concurrency:
        description: 'Concurrent requests'
        required: true
        default: '100'

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install hey
        run: |
          go install github.com/rakyll/hey@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run load test
        run: |
          hey -n ${{ github.event.inputs.total_requests }} \
              -c ${{ github.event.inputs.concurrency }} \
              -t 300 \
              "${{ github.event.inputs.target_url }}"

      - name: Save results
        if: always()
        run: echo "Test completed - check log above for summary"
